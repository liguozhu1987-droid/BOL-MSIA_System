# ============================================================
# MSIA 审核管理系统 - 配置文件
# ============================================================
# 部署时将此文件放在可执行程序 (msia_server.exe) 同目录下。
# 修改后重启程序即可生效, 无需重新打包。
#
# 关键差异说明:
#   - 本地开发环境: SQL Server 驱动版本通常为 17
#   - Windows Server: SQL Server 驱动版本通常为 18
#   - 通过 sql_driver_version 参数自动适配, 无需手写连接串
# ============================================================

[database]
# SQL Server 驱动版本: 17 或 18 (服务器一般为18, 本地一般为17)
sql_driver_version = 17

# 数据库服务器地址
db_server = IRSCNYTFINEREPORT.ap.inalfa.local

# 主数据库名称
db_name = CN_AME

# 数据库用户名
db_user = ytview

# 数据库密码
db_password = Inalfa@2021

# HR 数据库名称
hrdb_name = HRDB

# 是否信任服务器证书 (true/false)
trust_server_certificate = true


[mail]
# SMTP 服务器地址 (内网邮件服务器)
smtp_host = 172.19.253.10

# SMTP 端口
smtp_port = 25

# 是否启用 SSL (true/false)
enable_ssl = false

# SMTP 用户名 (内网无认证则留空)
smtp_username =

# SMTP 密码 (内网无认证则留空)
smtp_password =

# 发件人邮箱
from_address = msia-noreply@inalfa.local

# 发件人显示名称
from_display_name = MSIA 审核管理系统

# 邮件超时 (毫秒)
timeout_ms = 30000


[notification]
# 通知模式: test = 测试模式 (所有邮件发送到 test_email_recipients 指定邮箱)
#            production = 生产模式 (邮件发送给真实责任人/升级经理)
mode = test

# 测试模式下邮件接收地址 (多个用逗号分隔, 仅在 mode=test 时生效)
# 通常设置为管理员/测试人员的邮箱
test_email_recipients = admin@inalfa.local


[security]
# JWT 密钥 (生产环境请修改为随机长字符串)
jwt_secret_key = change-me-in-production

# JWT 算法
jwt_algorithm = HS256

# JWT 过期时间 (分钟), 43200=30天
jwt_expire_minutes = 43200


[server]
# 监听地址 (0.0.0.0 = 所有网卡)
host = 0.0.0.0

# 监听端口
port = 8000

# CORS 允许来源 (逗号分隔, 部署后改为实际访问地址)
cors_origins = http://localhost:5173,http://localhost:8000

# 系统访问 URL (邮件正文中的 "访问地址" 链接, 部署后改为用户实际访问的登录页地址)
# 为空时回退到 cors_origins 的第一项
system_url = http://172.26.2.203:8078/login

# 文件存储路径 (相对于程序目录)
storage_path = ./storage

# 开发环境自动建表 (生产环境设为 0)
auto_create_tables = 0
