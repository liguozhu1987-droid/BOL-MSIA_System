; ============================================================
; 认证功能开关 (方案文档 6.2, 双轨期)
; ============================================================
[auth]
; 自助注册开关 (R7): 统一身份认证期间关闭, 账号由管理员/同步创建
self_registration_enabled = False

; 本地账密登录双轨开关 (P4 单轨切换时置 False, 仅保留统一身份登录+游客通道)
local_auth_enabled = True

; 密码自助服务开关 (R14): 置 False 后改密/找回密码/重置密码均返回 403,
; 密码生命周期移交 Keycloak 控制台
password_self_service_enabled = True

; 员工状态回写 (R8 核心): 每小时从 CN_AME 中央表回写 Employee.status,
; 中央表停用 -> 本地 INACTIVE 并清除该员工 AuthToken
sso_status_sync_enabled = True

; 状态回写频率 (小时, 最小 1)
sso_status_sync_hours = 1

; CORS 白名单 (逗号分隔); 留空或不写 = 允许全部 (内网开发默认)
; cors_allowed_origins = http://bol.ap.inalfa.local

; ============================================================
; 统一身份登录 (Keycloak OIDC, 方案文档第 6 章)
; Keycloak 未部署完成前 oidc_enabled 保持 False, 行为与改造前完全一致
; ============================================================
[oidc]
; 是否启用统一身份登录 (True/False)
enabled = False

; Keycloak realm issuer (反代地址 + realm 名, 必须与 realm 配置一致)
issuer = https://sso.ap.inalfa.local/realms/inalfa

; OIDC 客户端 ID (Keycloak clients.md: bol-prod)
client_id = bol-prod

; OIDC 客户端密钥 (confidential client secret, 建好 bol-prod 后填入;
; 推荐用环境变量 OIDC_CLIENT_SECRET 注入, 优先级高于本文件且不落盘)
client_secret =

; 授权回调地址 (必须与 Keycloak bol-prod 的 Valid redirect URIs 精确一致;
; BOL 对外 URL 待确认 - 方案文档 U2, 暂按 waitress 默认端口占位,
; 确认后改为实际访问地址, 如 http://bol.ap.inalfa.local/api/auth/oidc/callback)
redirect_uri = http://127.0.0.1:8090/api/auth/oidc/callback

; 前端 OIDC 回调页 (后端 302 到此地址并带 ?otk= 一次性码)
front_callback = /oidc/callback

; 准入组: Keycloak 用户 groups claim 不含该值 -> 403 未开通本系统访问权限
required_group = app-bol

; 本地员工表未命中时是否自动建档 (True=按最低权限 VIEWER 自动创建)
auto_create_user = True

; OIDC 授权范围
scopes = openid profile email
