<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Microsoft YaHei, Segoe UI, SimHei, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1180" height="760" fill="#ffffff"/>

  <text x="32" y="42" font-size="22" font-weight="700" fill="#0f172a">三条认证路径对比：Keycloak 直连 AD / Keycloak 作 broker / 应用直连 Entra</text>
  <text x="32" y="68" font-size="13" fill="#64748b">同一批应用（MSIA / BOL / Capacity），只换"密码由谁校验"。三条路径互斥，不要同时上。</text>

  <!-- ================= 路线 A ================= -->
  <rect x="24" y="86" width="1132" height="180" rx="10" fill="#fbfdff" stroke="#cbd5e1"/>
  <text x="44" y="114" font-size="15" font-weight="700" fill="#0f172a">路线 A ── Keycloak 直连 AD（LDAP 联邦，见 ad-federation-assessment.md）</text>
  <rect x="1010" y="98" width="126" height="24" rx="12" fill="#dcfce7"/>
  <text x="1073" y="115" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">推荐作为基线</text>

  <rect x="60" y="144" width="210" height="76" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="165" y="172" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">MSIA / BOL / Capacity</text>
  <text x="165" y="194" font-size="11" fill="#475569" text-anchor="middle">OIDC + PKCE，按 groups 准入</text>

  <rect x="350" y="144" width="170" height="76" rx="8" fill="#e8f1fb" stroke="#4a7fb5"/>
  <text x="435" y="172" font-size="13" font-weight="700" fill="#1e3a5f" text-anchor="middle">Keycloak 25.0.6</text>
  <text x="435" y="194" font-size="11" fill="#475569" text-anchor="middle">inalfa realm / 本地组</text>

  <text x="695" y="202" font-size="11" fill="#94a3b8" text-anchor="middle">— 不经过 Entra（A 没有这一跳）—</text>

  <rect x="880" y="144" width="200" height="76" rx="8" fill="#eaf7ee" stroke="#4a9b6a"/>
  <text x="980" y="172" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">AD 域控</text>
  <text x="980" y="194" font-size="11" fill="#475569" text-anchor="middle">ap.inalfa.local</text>

  <line x1="270" y1="182" x2="344" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="307" y="174" font-size="10" fill="#475569" text-anchor="middle">OIDC</text>
  <line x1="520" y1="182" x2="874" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="697" y="174" font-size="10" fill="#475569" text-anchor="middle">LDAPS 636（sAMAccountName）</text>

  <text x="44" y="244" font-size="11.5" fill="#475569">应用改动 <tspan font-weight="700" fill="#15803d">0</tspan>（只改 Keycloak）· 新增故障点：DC / 636 不可达则全员登不上 · 无 MFA、无条件访问 · 组真相在 Keycloak</text>

  <!-- ================= 路线 B1 ================= -->
  <rect x="24" y="278" width="1132" height="180" rx="10" fill="#fbfdff" stroke="#cbd5e1"/>
  <text x="44" y="306" font-size="15" font-weight="700" fill="#0f172a">路线 B1 ── Keycloak 作 broker：应用不动，Keycloak 作为 OIDC 客户端上联 Entra</text>
  <rect x="1010" y="290" width="126" height="24" rx="12" fill="#fef3c7"/>
  <text x="1073" y="307" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">要 MFA 时选它</text>

  <rect x="60" y="336" width="210" height="76" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="165" y="364" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">MSIA / BOL / Capacity</text>
  <text x="165" y="386" font-size="11" fill="#15803d" text-anchor="middle">零改动（仍是 Keycloak 客户端）</text>

  <rect x="350" y="336" width="170" height="76" rx="8" fill="#e8f1fb" stroke="#4a7fb5"/>
  <text x="435" y="362" font-size="13" font-weight="700" fill="#1e3a5f" text-anchor="middle">Keycloak</text>
  <text x="435" y="382" font-size="11" fill="#475569" text-anchor="middle">Identity Provider: entra</text>
  <text x="435" y="399" font-size="11" fill="#475569" text-anchor="middle">组仍由本地成员关系发</text>

  <rect x="610" y="336" width="170" height="76" rx="8" fill="#ede9fe" stroke="#7c5cd6"/>
  <text x="695" y="362" font-size="13" font-weight="700" fill="#3b2a63" text-anchor="middle">Entra ID</text>
  <text x="695" y="382" font-size="11" fill="#475569" text-anchor="middle">MFA / 条件访问</text>
  <text x="695" y="399" font-size="11" fill="#475569" text-anchor="middle">证书凭据</text>

  <rect x="880" y="336" width="200" height="76" rx="8" fill="#eaf7ee" stroke="#4a9b6a"/>
  <text x="980" y="362" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">AD 域控</text>
  <text x="980" y="382" font-size="11" fill="#475569" text-anchor="middle">Entra Connect 已同步</text>
  <text x="980" y="399" font-size="11" fill="#475569" text-anchor="middle">（PHS / PTA / ADFS）</text>

  <line x1="270" y1="374" x2="344" y2="374" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="307" y="366" font-size="10" fill="#475569" text-anchor="middle">配置不变</text>
  <line x1="520" y1="374" x2="604" y2="374" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="562" y="366" font-size="10" fill="#475569" text-anchor="middle">OIDC 上联</text>
  <line x1="780" y1="374" x2="874" y2="374" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arG)"/>
  <text x="827" y="366" font-size="10" fill="#64748b" text-anchor="middle">同步</text>

  <text x="44" y="438" font-size="11.5" fill="#475569">应用改动 <tspan font-weight="700" fill="#15803d">0</tspan> · 组不用重挂（身份链到同一个 Keycloak 用户）· 新增故障点：Entra 不可达则新登录全失败；UPN 与 username 对不上会建出第二个账号</text>

  <!-- ================= 路线 B2 ================= -->
  <rect x="24" y="470" width="1132" height="180" rx="10" fill="#fffdfd" stroke="#e5b4b4"/>
  <text x="44" y="498" font-size="15" font-weight="700" fill="#0f172a">路线 B2 ── 应用直连 Entra：Keycloak 退场，三套应用各自注册</text>
  <rect x="1010" y="482" width="126" height="24" rx="12" fill="#fee2e2"/>
  <text x="1073" y="499" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">改动最大</text>
  <rect x="756" y="482" width="238" height="24" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="875" y="499" font-size="11" fill="#64748b" text-anchor="middle">Keycloak 退场：client / 组 / 脚本停用</text>

  <rect x="60" y="528" width="210" height="76" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="165" y="556" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">MSIA / BOL / Capacity</text>
  <text x="165" y="578" font-size="11" fill="#b91c1c" text-anchor="middle">改配置 + 改 validate_config</text>

  <rect x="610" y="528" width="170" height="76" rx="8" fill="#ede9fe" stroke="#7c5cd6"/>
  <text x="695" y="556" font-size="13" font-weight="700" fill="#3b2a63" text-anchor="middle">Entra ID</text>
  <text x="695" y="578" font-size="11" fill="#475569" text-anchor="middle">issuer = login.microsoftonline.com</text>

  <rect x="880" y="528" width="200" height="76" rx="8" fill="#eaf7ee" stroke="#4a9b6a"/>
  <text x="980" y="556" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">AD 域控</text>
  <text x="980" y="578" font-size="11" fill="#475569" text-anchor="middle">Entra Connect 已同步</text>

  <line x1="270" y1="566" x2="604" y2="566" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="437" y="558" font-size="10" fill="#475569" text-anchor="middle">OIDC 直连（redirect 必须 https）</text>
  <line x1="780" y1="566" x2="874" y2="566" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arG)"/>
  <text x="827" y="558" font-size="10" fill="#64748b" text-anchor="middle">同步</text>

  <text x="44" y="630" font-size="11.5" fill="#475569">应用改动 <tspan font-weight="700" fill="#b91c1c">改代码 + 重新打包发版</tspan> · 组声明变 GUID、超 200 组直接 overage · 回滚要回到 Keycloak 还活着的那一刻</text>

  <!-- ================= 图例 ================= -->
  <rect x="24" y="662" width="1132" height="78" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="686" font-size="12" font-weight="700" fill="#0f172a">图例</text>
  <rect x="96" y="676" width="14" height="14" rx="3" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="116" y="688" font-size="11" fill="#475569">应用（不改）</text>
  <rect x="214" y="676" width="14" height="14" rx="3" fill="#e8f1fb" stroke="#4a7fb5"/>
  <text x="234" y="688" font-size="11" fill="#475569">Keycloak（改配置）</text>
  <rect x="374" y="676" width="14" height="14" rx="3" fill="#ede9fe" stroke="#7c5cd6"/>
  <text x="394" y="688" font-size="11" fill="#475569">Entra ID</text>
  <rect x="486" y="676" width="14" height="14" rx="3" fill="#eaf7ee" stroke="#4a9b6a"/>
  <text x="506" y="688" font-size="11" fill="#475569">AD 域控（不改）</text>
  <rect x="616" y="676" width="14" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="636" y="688" font-size="11" fill="#64748b">退场 / 不涉及</text>
  <text x="44" y="716" font-size="11" fill="#475569">结论：有 Entra 就走 B1（应用零改动、组不用重挂、回滚只是停用一个 IdP）；只有"必须下线 Keycloak"或"IT 要求应用直接注册在 Entra"才走 B2。</text>
  <text x="44" y="732" font-size="11" fill="#475569">A 与 B 互斥：B 的前提是 Entra Connect 已把 AD 账号同步到云；同步不存在时，B 拿到的只是另一套云密码。</text>
</svg>
