###############################################################################
# keycloak.conf —— Keycloak 25.0.6 生产配置（T01）
#   26.x 已因 SQL Server 2017 不支持 OPTIMIZE_FOR_SEQUENTIAL_KEY 回退为 25.0.6，
#   重装流程见 docs/keycloak-deploy-runbook.md 第 10 节。
# 位置: C:\keycloak\conf\keycloak.conf
# 依据: 《统一身份认证实施方案_MSIA与BOL系统.md》7.1 节
#
# 部署前提（P1，方案文档 7.1/8.1）:
#   1) JDK 21（Temurin LTS）已安装，JAVA_HOME 已配置
#   2) SQL Server 已建独立 keycloak 库 + keycloak_svc 账号（db_owner/ddladmin）
#      CREATE DATABASE keycloak; CREATE LOGIN keycloak_svc WITH PASSWORD='...';
#      （口令走环境变量，不落本文件——见下方 db-password 说明）
#      【为什么不共用 CN_AME】Keycloak 运行需要 db_owner（建表/改表，升级时也要）。
#      若与 CN_AME 共用：① 该账号对中央人员表 CN_AME_SSO_User 等业务表同样拥有
#      db_owner，构成"攻破 Keycloak 账号 → 改写身份唯一事实来源"的提权路径；
#      ② 备份/恢复耦合——业务库恢复会连带回滚 Keycloak 会话与用户；
#      ③ 升级 liquibase 迁移的爆炸半径落在业务库内。同实例多一个库对 DBA
#      只是 CREATE DATABASE 的成本，隔离收益远大于此。
#   3) MSSQL JDBC 驱动（mssql-jdbc-*.jar）已放入 C:\keycloak\providers\
#      并执行过 kc.bat build
#   4) NSSM 注册服务: nssm install Keycloak "C:\keycloak\bin\kc.bat" start --optimized
#      JAVA_HOME 与 KC_DB_PASSWORD 必须同时写进 NSSM 的 AppEnvironmentExtra
#      （服务不继承用户变量；缺 JAVA_HOME 会回落系统 Java 8）
#   5) 初始管理员 kcadmin：25.0.6 无 bootstrap-admin 命令，改为首次启动前设
#      KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD 环境变量（仅 master 域，break-glass 封存），
#      创建后立即清除；详见 runbook 10.7。
#
# SMTP 说明（本环境既定）:
#   SMTP 不属于本文件参数（Keycloak 的 SMTP 是 realm 级配置）。
#   本环境为 172.19.253.10:25 无密码无认证、不开 SSL/StartTLS，
#   详见同目录 realm-setup.md 第一节。
###############################################################################

# ---------- 数据库（独立 keycloak 库，不进 CN_AME 业务库） ----------
db=mssql
db-url=jdbc:sqlserver://IRSCNYTFINEREPORT.ap.inalfa.local:1433;databaseName=keycloak;encrypt=true;trustServerCertificate=true
db-username=keycloak_svc
# 口令两种方式（二选一，推荐 A）:
#   A. 环境变量 KC_DB_PASSWORD（NSSM 服务环境/系统环境变量）——优先级高于本属性
#   B. 直接写本文件（不推荐，明文落盘）
# db-password 不落盘：由 NSSM 服务环境变量 KC_DB_PASSWORD 注入（runbook 10.8）。
# 手工启动前先设 $env:KC_DB_PASSWORD=<keycloak_svc口令>。

# ---------- 主机名与反代 ----------
# 对外唯一入口（IIS ARR 反代，企业证书；ARR 与 KC 同机部署于 IRSCnKettle01）；KC 本身只听本机 8443
hostname=sso.ap.inalfa.local
# 必须开启，否则反代后 redirect_uri 会变 127.0.0.1（TR12）
proxy-headers=xforwarded
# 严格校验 Host 头，防 Host 头注入
hostname-strict=true
# 注意：原 26 配置里的 hostname-strict-https=true 已删除——25.0 起 hostname v2 为默认，
# 该选项已不存在（保留会导致 build 报 Unrecognized option）。HTTPS 强制由 http-enabled=false 保证。

# ---------- 监听端口 ----------
# 关闭 8080 明文；8443 仅本机回环 + 同机 IIS ARR 访问；443 由 IIS ARR 占用
http-enabled=false
https-port=8443
# 仅绑定本机回环（反代同机），彻底不对网卡暴露
https-client-auth=none

# ---------- 8443 本机回环 HTTPS 证书（自签即可） ----------
# 对外 443 的企业证书（sso.ap.inalfa.local）装在 IIS ARR，不经 Keycloak；
# 8443 只有同机 IIS ARR 访问，ARR 作为客户端不校验证书，故此处用自签证书。
# http-enabled=false 时必须配置证书，否则 Keycloak 无法启动。
# 生成命令（任一带 openssl 的机器，Git Bash 亦可）：
#   openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 3650 ^
#     -keyout server.key.pem -out server.crt.pem -subj "/CN=localhost"
# 将两个文件放到 C:\keycloak\conf\ 后保持下面两行不变：
https-certificate-file=C:/keycloak/conf/server.crt.pem
https-certificate-key-file=C:/keycloak/conf/server.key.pem

# ---------- 健康检查（health_check.ps1 使用） ----------
health-enabled=true
# 管理端口仅本机: http://127.0.0.1:9000/health/ready
http-management-port=9000

# ---------- 日志 ----------
log=file
log-file=C:/keycloak/logs/keycloak.log
# 生产排障期可临时改 debug，定位完成后改回 info
log-level=info

# ---------- 其他 ----------
# 允许 metric 端点（后续可接监控，本期不用）
metrics-enabled=true
